name: Isolated public scroll data probe
on:
  push:
    branches: ['research/vesuvius-public-data-20260909']
    paths: ['.github/workflows/vesuvius-public-data-probe.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Retrieve a bounded sample from official public data only
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, datetime, hashlib, json, pathlib, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          OUT = pathlib.Path('scroll-probe'); OUT.mkdir()
          BASE = 'https://vesuvius-challenge-open-data.s3.us-east-1.amazonaws.com/'
          SEG = 'PHerc1447/segments/20250703025628-auto_grown_20250703025628283/'
          NS = {'s':'http://s3.amazonaws.com/doc/2006-03-01/'}
          entries, listings = [], []
          budget = {'requests':0, 'bytes':0}
          def get(url, name, limit=4*1024*1024):
              if budget['requests'] >= 28 or budget['bytes'] >= 24*1024*1024:
                  return None
              assert url.startswith(BASE), 'Only the official public bucket is permitted'
              budget['requests'] += 1
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Vesuvius-public-research-probe/1.0'}), timeout=15) as response:
                      size = int(response.headers.get('Content-Length',0))
                      if size > limit: raise ValueError('File exceeds per-request cap')
                      payload = response.read(min(limit,24*1024*1024-budget['bytes'])+1)
                      if len(payload) > limit or budget['bytes']+len(payload)>24*1024*1024:
                          raise ValueError('Download exceeds cap')
                  budget['bytes'] += len(payload)
                  path = OUT/name; path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(payload)
                  entries.append({'url':url,'file':name,'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()})
                  print('OK',name,len(payload),flush=True)
                  return payload
              except Exception as exc:
                  entries.append({'url':url,'file':name,'error':str(exc)})
                  print('ERROR',name,type(exc).__name__,str(exc)[:180],flush=True)
                  return None
          def listing(prefix):
              url=BASE+'?'+urllib.parse.urlencode({'list-type':'2','prefix':prefix,'delimiter':'/','max-keys':'100'})
              payload=get(url,'listing-%02d.xml'%len(listings),512*1024)
              if payload is None: return [],[]
              root=ET.fromstring(payload)
              dirs=[p.text for p in root.findall('s:CommonPrefixes/s:Prefix',NS)]
              files=[{'key':n.find('s:Key',NS).text,'size':int(n.find('s:Size',NS).text)} for n in root.findall('s:Contents',NS)]
              row={'prefix':prefix,'dirs':dirs,'files':files,'truncated':root.findtext('s:IsTruncated',namespaces=NS)}
              listings.append(row); print(json.dumps(row),flush=True)
              return dirs,files
          listing('PHerc1447/segments/')
          for name in ('meta.json','x.tif','y.tif','z.tif'):
              get(BASE+SEG+'mesh/tifxyz/'+name,'mesh/'+name)
          queue=collections.deque([(SEG,0)])
          while queue and budget['requests']<25:
              prefix,depth=queue.popleft()
              dirs,files=listing(prefix)
              for item in files:
                  key=item['key']; leaf=key.rsplit('/',1)[-1]
                  if item['size']<256*1024 and (leaf.endswith('.json') or leaf in ('.zarray','.zattrs','.zgroup')):
                      get(BASE+urllib.parse.quote(key,safe='/'),'metadata/'+key[len(SEG):],256*1024)
              if depth<3:
                  for directory in dirs[:8]:
                      # Mesh coordinates were fetched above. Inspect surface-volume metadata without bulk chunks.
                      relative=directory[len(SEG):]
                      if not relative.startswith(('mesh/','labels/','predictions/','ink/')):
                          queue.append((directory,depth+1))
          manifest={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Official pre-existing public PHerc1447 data; no new readings or prize claim','budget':budget,'files':entries,'listings':listings}
          (OUT/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (OUT/'README.txt').write_text('Public input sample for private analysis. Source: Vesuvius Challenge open data. Dataset licence/attribution must be retained; this job does not relicense source data. No image synthesis, prize submission, repository deployment or live-site modification. All downloaded bytes are capped and checksummed.\n')
          print('FINAL',json.dumps(budget),flush=True)
          PY
      - name: Preserve the public input sample for this verification only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vesuvius-public-input-probe
          path: scroll-probe/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
