name: Isolated complete public surface inputs
on:
  push:
    branches: ['research/vesuvius-public-data-20260909']
    paths: ['.github/workflows/vesuvius-full-surface-inputs.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Download existing public CT layers only
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, threading, urllib.request
          OUT=pathlib.Path('surface-inputs'); OUT.mkdir()
          BASE='https://vesuvius-challenge-open-data.s3.us-east-1.amazonaws.com/PHerc1447/segments/20250703025628-auto_grown_20250703025628283/'
          ROOT=BASE+'surface-volumes/8.64um-1.2m-116keV-volume-20250521151220'
          tasks=[(ROOT+'.tifs/%02d.tif'%z, 'whole/%02d.tif'%z, 20*1024*1024) for z in range(31) if z not in (5,10,15,20,25)]
          tasks += [(ROOT+'.zarr/.zattrs','zattrs.json',20000),(ROOT+'.zarr/0/.zarray','zarray.json',20000)]
          lock=threading.Lock(); rows=[]; total=0
          def fetch(task):
              global total
              url,name,limit=task
              assert url.startswith(BASE)
              row={'url':url,'file':name}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Bounded-public-scroll-input-research/1.0'}),timeout=45) as response:
                      if int(response.headers.get('Content-Length',0))>limit: raise ValueError('Per-file cap exceeded')
                      data=response.read(limit+1)
                  if len(data)>limit: raise ValueError('Per-file cap exceeded')
                  with lock:
                      if total+len(data)>260*1024*1024: raise ValueError('Total cap exceeded')
                      total+=len(data)
                  p=OUT/name; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
                  row.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as exc: row['error']=str(exc)
              with lock: rows.append(row)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(fetch,tasks))
          errors=[r for r in rows if 'error' in r]
          (OUT/'manifest.json').write_text(json.dumps({'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Existing public CT input layers only. No new predictions, readings, transcriptions, secrets, deployment, paid APIs or scheduled work. Five original layers already obtained separately are not duplicated.','volume':'20250521151220','scroll':'PHerc1447','bytes':total,'files':sorted(rows,key=lambda r:r['file'])},indent=2))
          (OUT/'README.txt').write_text('Original public Vesuvius Challenge CT inputs. Preserve the original dataset attribution and licensing. These are not new readings or an award submission.\n')
          print('DOWNLOADED',total,'bytes;',len(rows)-len(errors),'of',len(rows),'successful')
          for row in errors: print(json.dumps(row))
          if errors: raise SystemExit('One or more required inputs failed')
          PY
      - name: Transfer existing public inputs for local inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vesuvius-complete-public-surface-inputs
          path: surface-inputs/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
