name: Isolated public ink model inputs
on:
  push:
    branches: ['research/vesuvius-public-data-20260909']
    paths: ['.github/workflows/vesuvius-ink-model-inputs.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download public reference models and source without executing them
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, threading, urllib.request
          OUT=pathlib.Path('ink-inputs'); OUT.mkdir()
          SHA='3ea17f54a9b3d5fd1aaf73e1d2c8386dbaa9f30e'
          MODEL='7109667e2607db1b90c37c8b09cb876ea7fe7bb1'
          lock=threading.Lock(); entries=[]; total=0
          def download(task):
              global total
              url,name,limit=task
              row={'url':url,'file':name}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Vesuvius-public-input-research/2.0'}),timeout=90) as r:
                      if int(r.headers.get('Content-Length',0))>limit: raise ValueError('per-file cap')
                      data=r.read(limit+1)
                  if len(data)>limit: raise ValueError('per-file cap')
                  with lock:
                      if total+len(data)>350*1024*1024: raise ValueError('total cap')
                      total+=len(data)
                  dest=OUT/name; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
                  row.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as e: row['error']=str(e)
              with lock: entries.append(row)
              return row
          tree_url=f'https://api.github.com/repos/ScrollPrize/villa/git/trees/{SHA}?recursive=1'
          result=download((tree_url,'source-tree.json',5*1024*1024))
          tree=json.loads((OUT/'source-tree.json').read_text()); assert not tree.get('truncated')
          prefixes=('ink-detection/koine_machines/','ink-detection/configs/','ink-detection/scripts/','vesuvius/src/vesuvius/models/','vesuvius/src/vesuvius/utils/')
          tasks=[]
          for e in tree['tree']:
              p=e['path']
              if e['type']!='blob': continue
              take=(p.startswith(prefixes) and p.endswith(('.py','.json','.md','.toml'))) or p in ['LICENSE','vesuvius/pyproject.toml','ink-detection/pyproject.toml','vesuvius/src/vesuvius/__init__.py','vesuvius/src/vesuvius/_version.py'] or (p.startswith(('ink-detection/','vesuvius/')) and p.rsplit('/',1)[-1].lower().startswith(('license','copying','notice')))
              if take:
                  assert e.get('size',0)<2*1024*1024
                  tasks.append((f'https://raw.githubusercontent.com/ScrollPrize/villa/{SHA}/{p}','source/'+p,2*1024*1024))
          assert len(tasks)<900
          tasks += [(f'https://huggingface.co/scrollprize/ink_9um/resolve/{MODEL}/hybrid_3d2d-seed{s}/step-075000.pth',f'models/seed{s}-075000.pth',150*1024*1024) for s in (42,43)]
          tasks += [(f'https://huggingface.co/scrollprize/ink_9um/resolve/{MODEL}/README.md','models/README.md',20000),('https://huggingface.co/buckets/scrollprize/datasets/resolve/ink_9um/README.md','control/dataset-README.md',30000)]
          LABEL='https://huggingface.co/buckets/scrollprize/datasets/resolve/ink_9um/labels/aligned-scrollprizeorg-21slices/pherc0139-w016/'
          for kind in ('inklabels','supervision_mask','validation_mask'):
              for key in ('.zarray','.zattrs'):
                  tasks.append((LABEL+f'pherc0139-w016_{kind}.zarr/'+key,f'control/{kind}/{key}',30000))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(download,tasks))
          metadata={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Only existing public input files; no inference, new readings, secrets, deployment, schedules or paid APIs. Code is downloaded for inspection, not executed.','source_commit':SHA,'model_commit':MODEL,'bytes':total,'files':sorted(entries,key=lambda e:e['file'])}
          (OUT/'manifest.json').write_text(json.dumps(metadata,indent=2))
          print('TOTAL',total,'FILES',len(entries),'ERRORS',sum('error'in e for e in entries))
          for e in entries:
              if 'error' in e: print(json.dumps(e))
          PY
      - name: Transfer reference inputs for local analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vesuvius-public-ink-model-inputs
          path: ink-inputs/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
