name: Vesuvius isolated research
on:
  push:
    branches: [research/vesuvius-progress-20260909]
    paths:
      - .github/workflows/vesuvius-research.yml
      - research/vesuvius/**
permissions:
  contents: read
concurrency:
  group: vesuvius-progress-20260909
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'LAC0STE4784/LAC0STE4784.github.io' && github.ref == 'refs/heads/research/vesuvius-progress-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RESEARCH_SHA: ${{ github.sha }}
    steps:
      - name: Retrieve pinned research and upstream sources
        shell: bash
        run: |
          set -euo pipefail
          git init research-repo
          git -C research-repo remote add origin https://github.com/LAC0STE4784/LAC0STE4784.github.io.git
          git -C research-repo fetch --depth=1 origin "$RESEARCH_SHA"
          git -C research-repo checkout --detach FETCH_HEAD
          git init upstream
          git -C upstream remote add origin https://github.com/WillStevens/scrollreading.git
          git -C upstream fetch --depth=1 origin 62cbc21bdafbe0313fee11d781d729256a14262e
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 62cbc21bdafbe0313fee11d781d729256a14262e
          g++ --version | head -1
      - name: Dependencies in disposable public runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtiff-dev
          python3 -m venv .venv
          .venv/bin/pip install --only-binary=:all: --disable-pip-version-check blosc2==4.12.0 numpy==2.5.3 tifffile==2026.9.9
          .venv/bin/pip freeze
      - name: Real geometry, complete builds and bounded native commands
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python research-repo/research/vesuvius/validate_real.py validation-work upstream/pipeline9
