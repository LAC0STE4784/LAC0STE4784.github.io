name: Public prosecution reference documents
on:
  push:
    branches: ['research/fe-bounty-local-20260909']
    paths: ['.github/workflows/patent-reference-documents.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read the same public document API used by the anonymous viewer
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,time,urllib.request,urllib.parse
          out=pathlib.Path('results');out.mkdir()
          cap=45*1024*1024;total=0;rows=[]
          def read(url,limit):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json, application/pdf','User-Agent':'Public-patent-reference-review/1.0'}),timeout=30) as r:
                  raw=r.read(limit+1)
              if len(raw)>limit:raise ValueError('per-file limit')
              return raw
          for app in ['13030118','61417453']:
              index_url='https://ez-patents.com/api/v1/patent/applications/'+app+'/documents'
              try:
                  raw=read(index_url,2*1024*1024)
                  index=json.loads(raw);(out/(app+'-index.json')).write_bytes(raw)
              except Exception as exc:
                  rows.append({'application':app,'index_url':index_url,'error':str(exc)});continue
              docs=index.get('documentBag',[])
              selected=[]
              for doc in docs:
                  description=doc.get('documentCodeDescriptionText','').lower()
                  needles=['references cited','information disclosure','arguments/remarks','non-final rejection','other reference-patent/application/search','notice of allowance']
                  include=any(n in description for n in needles) or description=='claims'
                  if app=='61417453':include=description in ['specification','claims','drawings-only black and white line drawings'] or include
                  if include:selected.append(doc)
              for number,doc in enumerate(selected[:25]):
                  option=next((d for d in doc.get('downloadOptionBag',[]) if d.get('mimeTypeIdentifier')=='PDF'),None)
                  if option is None:continue
                  original=option['downloadUrl']
                  parsed=urllib.parse.urlparse(original)
                  if parsed.scheme!='https' or parsed.netloc!='api.uspto.gov':
                      rows.append({'application':app,'description':doc.get('documentCodeDescriptionText'),'error':'unexpected source host'});continue
                  proxy='https://ez-patents.com'+parsed.path+('?' + parsed.query if parsed.query else '')
                  row={'application':app,'document':doc,'original_url':original,'public_viewer_url':proxy}
                  try:
                      data=read(proxy,4*1024*1024)
                      if not data.startswith(b'%PDF'):raise ValueError('not a PDF')
                      total+=len(data)
                      if total>cap:raise ValueError('total cap')
                      filename=f'{app}-{number:02d}.pdf'
                      (out/filename).write_bytes(data)
                      row.update(file=filename,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  except Exception as exc:row['error']=str(exc)
                  rows.append(row)
                  time.sleep(.2)
              (out/'manifest.json').write_text(json.dumps({'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Public prosecution reference lists/claims/arguments only; no login or submissions. Source metadata and original USPTO URLs retained.','bytes':total,'documents':rows},indent=2))
          (out/'manifest.json').write_text(json.dumps({'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'bytes':total,'documents':rows},indent=2))
          print('Downloaded',sum('file' in r for r in rows),'documents; bytes',total)
          PY
      - name: Preserve original public records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patent-reference-documents-20260909
          path: results/
          retention-days: 1
          if-no-files-found: error
